services:
  - type: web
    name: carepulse-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: carepulse_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
